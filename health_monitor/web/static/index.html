<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>health-monitor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/vendor/uPlot.min.css">
<style>
:root {
  --bg:#12141a; --panel:#1a1d25; --panel2:#21252f; --line:#2c313d;
  --fg:#e3e6ed; --dim:#8b93a5; --accent:#4da3ff; --warn:#ffb020;
  --bad:#ff5757; --good:#3ecf8e;
  --font: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.45 var(--font); }
button, select, input { font:inherit; color:var(--fg); background:var(--panel2);
  border:1px solid var(--line); border-radius:4px; padding:4px 8px; }
button { cursor:pointer; }
button:hover { border-color:var(--accent); }
button.primary { background:var(--accent); color:#07101c; border-color:var(--accent); font-weight:600; }
button.danger:hover { border-color:var(--bad); color:var(--bad); }
button:disabled { opacity:.4; cursor:not-allowed; }
a { color:var(--accent); }

#bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:8px 12px;
  background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
#bar .sep { width:1px; height:22px; background:var(--line); }
#bar label { color:var(--dim); font-size:12px; }
#status { margin-left:auto; display:flex; gap:10px; align-items:center; font-size:12px; flex-wrap:wrap; }
.pill { padding:2px 8px; border-radius:10px; background:var(--panel2); border:1px solid var(--line); }
.pill.rec { color:var(--good); border-color:#20503c; }
.pill.stopped { color:var(--bad); border-color:#5a2020; font-weight:700; }
.pill.warn { color:var(--warn); border-color:#5a4520; }

/* burger */
#burger { position:relative; }
#menu { position:absolute; right:0; top:34px; background:var(--panel); border:1px solid var(--line);
  border-radius:6px; min-width:260px; padding:6px 0; display:none; z-index:60; box-shadow:0 8px 24px rgba(0,0,0,.5); }
#menu.on { display:block; }
#menu .item { display:block; width:100%; text-align:left; background:none; border:0; border-radius:0;
  padding:8px 14px; }
#menu .item:hover { background:var(--panel2); }
#menu .info { padding:6px 14px; color:var(--dim); font-size:11px; border-top:1px solid var(--line); margin-top:4px; }
#menu .info b { color:var(--fg); }

/* monitors strip */
#monitors { display:flex; gap:8px; padding:6px 12px; background:var(--panel); border-bottom:1px solid var(--line);
  flex-wrap:wrap; font-size:12px; }
.mon { display:flex; gap:6px; align-items:center; padding:3px 9px; border:1px solid var(--line);
  border-radius:5px; background:var(--panel2); }
.mon .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
.mon.online .dot { background:var(--good); }
.mon.stale .dot { background:var(--warn); }
.mon.offline .dot { background:var(--bad); }
.mon .g { color:var(--dim); }
.mon .g b { color:var(--fg); font-weight:500; }

#ranges { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 12px;
  background:var(--panel); border-bottom:1px solid var(--line); }
#ranges .quick { display:flex; gap:4px; }
#ranges .quick button.on { background:var(--accent); color:#07101c; border-color:var(--accent); }

#sources { padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
.src { display:flex; gap:8px; align-items:center; margin:4px 0; flex-wrap:wrap; }
.src .dbs { flex:1; min-width:260px; }
.src .shift { display:flex; gap:3px; align-items:center; }
.src .shift button { padding:2px 6px; font-size:11px; }
.srcname { min-width:70px; color:var(--dim); }

#graphs { padding:12px; display:flex; flex-direction:column; gap:14px; }
.graph { background:var(--panel); border:1px solid var(--line); border-radius:6px; }
.graph .head { display:flex; gap:8px; align-items:center; padding:6px 10px; border-bottom:1px solid var(--line); }
.graph .head input.title { background:transparent; border:1px solid transparent; flex:1; font-weight:600; }
.graph .head input.title:focus { border-color:var(--line); background:var(--panel2); }
.graph .body { padding:6px 4px 2px; position:relative; }
.legend { display:flex; flex-wrap:wrap; gap:4px 16px; padding:6px 12px 10px;
  border-top:1px solid var(--line); font-size:12px; }
.legend .item { display:flex; gap:6px; align-items:center; }
.legend .sw { width:11px; height:3px; border-radius:2px; flex:none; }
.legend .val { color:var(--dim); font-variant-numeric:tabular-nums; }
.legend .item .x { color:var(--dim); cursor:pointer; padding:0 2px; }
.legend .item .x:hover { color:var(--bad); }
.legend .mon { padding:0 5px; font-size:10px; }
.legend.frozen { background:#4a1020; border-top-color:#7a2038; }
.legend.frozen .val { color:#ffd9e2; font-weight:600; }
.frozen-tag { background:#7a2038; color:#ffd9e2; border-radius:3px; padding:1px 7px; font-size:11px; font-weight:700; }
.graph.frozen { border-color:#7a2038; }
.empty { color:var(--dim); padding:24px; text-align:center; }
.u-select { background:rgba(77,163,255,.16); border:1px solid rgba(77,163,255,.55);
  border-left-width:2px; border-right-width:2px; }
.u-cursor-x, .u-cursor-y { border-color:rgba(230,236,245,.45) !important; }
.u-legend { display:none; }
.dragtip { position:absolute; z-index:12; pointer-events:none; background:var(--panel2);
  border:1px solid var(--accent); border-radius:4px; padding:3px 8px; font-size:11px; white-space:nowrap; }

#modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
  align-items:center; justify-content:center; z-index:50; }
#modal.on { display:flex; }
.sheet { background:var(--panel); border:1px solid var(--line); border-radius:8px;
  width:min(900px,94vw); max-height:88vh; display:flex; flex-direction:column; }
.sheet h3 { margin:0; padding:12px 16px; border-bottom:1px solid var(--line); font-size:14px; }
.sheet .content { overflow:auto; padding:12px 16px; flex:1; }
.sheet .foot { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); align-items:center; }
.sheet .foot .count { color:var(--dim); margin-right:auto; }
.grp { margin-bottom:6px; border:1px solid var(--line); border-radius:5px; }
.grp > summary { padding:6px 10px; cursor:pointer; background:var(--panel2); border-radius:5px; }
.grp .unit { color:var(--dim); font-size:11px; }
.grp .items { padding:6px 10px; display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:2px 12px; }
.grp .items label { display:flex; gap:6px; align-items:center; cursor:pointer; }
.grp .items label:hover { color:var(--accent); }
.note { color:var(--dim); font-size:11px; }
.rowbtns { display:flex; gap:6px; margin:6px 0; flex-wrap:wrap; }
.setrow { display:flex; gap:10px; align-items:center; margin:10px 0; flex-wrap:wrap; }
.setrow label { min-width:230px; }
.msg { padding:8px 12px; border-radius:4px; margin:8px 0; }
.msg.err { background:#3a1a1a; color:#ff9b9b; border:1px solid #5a2020; }
.msg.ok { background:#14301f; color:#8ee6bb; border:1px solid #20503c; }
table.tbl { border-collapse:collapse; width:100%; font-size:12px; }
table.tbl th, table.tbl td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
table.tbl th { color:var(--dim); font-weight:500; }
#toast { position:fixed; right:16px; bottom:16px; z-index:80; display:flex; flex-direction:column; gap:8px; }
#toast .t { background:var(--panel); border:1px solid var(--line); padding:10px 14px; border-radius:6px; max-width:420px; }
#toast .t.err { border-color:#5a2020; color:#ff9b9b; }
.monpick { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.monpick button.on { background:var(--accent); color:#07101c; border-color:var(--accent); }
</style>
</head>
<body>

<div id="bar">
  <strong>health-monitor</strong>
  <label>profile</label>
  <select id="profile"></select>
  <button id="saveAs">Save as…</button>
  <button id="save">Save</button>
  <button id="delProfile" class="danger">Delete profile</button>
  <div class="sep"></div>
  <button id="addGraph">+ Graph</button>
  <div id="status"></div>
  <div id="burger">
    <button id="burgerBtn" title="menu">☰</button>
    <div id="menu"></div>
  </div>
</div>

<div id="monitors"></div>

<div id="ranges">
  <label>range</label>
  <div class="quick" id="quick"></div>
  <div class="sep"></div>
  <label>from</label><input type="datetime-local" id="from" step="1">
  <label>to</label><input type="datetime-local" id="to" step="1">
  <button id="applyRange">Apply</button>
  <label><input type="checkbox" id="liveTail"> follow live</label>
</div>

<div id="sources"></div>
<div id="graphs"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script src="/static/vendor/uPlot.iife.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
